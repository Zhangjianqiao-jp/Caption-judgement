[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "caption-judgement"
version = "0.1.0"
description = "Deterministic, blinded, image-clustered evaluation for humorous image captions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Caption Judgement contributors"}]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = ["pytest>=8"]
semantic = ["sentence-transformers>=3", "numpy>=1.26"]

[project.scripts]
caption-judge = "caption_judgement.cli:main"

[tool.setuptools.packages.find]
include = ["caption_judgement*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
